<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="../core/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>太陽能板拆框機器人上下料 — 3D 設備模擬</title>
<link rel="stylesheet" href="css/style.css">
<!-- 共用版面（精簡版面、相機視窗、工具列）的樣式 core/ui/viewer-workspace.css 由 createViewerWorkspace 自動載入 -->
<script type="importmap">
{ "imports": {
    "three": "../core/vendor/three.module.js",
    "three/addons/": "../core/vendor/addons/",
    "@core/": "../core/"
} }
</script>
</head>
<body>
<!-- 標準骨架（core/README.md「小螢幕與觸控」）：#topbar（.brand、#stations、.views）、#side、#bottombar（.ctl、.stepRow、#timeline、#clock）；
     窄螢幕與觸控裝置的精簡版面由 createViewerWorkspace 處理，style.css 只寫桌面版面 -->
<div id="app">
  <canvas id="c"></canvas>

  <header id="topbar">
    <div class="brand">
      <div class="title">太陽能板拆框機器人上下料</div>
      <div class="sub">FANUC M-710iC/45M＋懸臂移載機：A/B 雙工位上下料、拆框機訊號交握、餘料外送</div>
    </div>
    <nav id="stations" aria-label="站別"></nav>
    <div class="views">
      <button data-view="iso">全景</button>
      <button data-view="transfer">交接</button>
      <button data-view="machine">拆框機</button>
      <button data-view="inlet">入料</button>
      <button data-view="outlet">出料</button>
      <button data-view="scrap">餘料</button>
      <button data-view="top">俯視</button>
      <button data-view="gripper">特寫</button>
      <button data-view="electrical">電盤配線</button>
    </div>
  </header>

  <aside id="side">
    <section class="card">
      <h3>目前動作 <span class="hint" id="stationName"></span></h3>
      <div id="action" class="action">待命</div>
      <div id="substep" class="substep"></div>
    </section>
    <section class="card">
      <h3>情境 <span class="hint" id="cycleNote"></span></h3>
      <select id="scenario" aria-label="情境"><option value="">正常生產</option><option value="fault">拆框機故障（第 2 片卡料）</option></select>
    </section>
    <section class="card">
      <h3>棧板工位</h3>
      <dl id="bays" class="stats"></dl>
    </section>
    <section class="card">
      <h3>訊號交握（PLC）</h3>
      <ul id="signals" class="signals"></ul>
    </section>
    <section class="card">
      <h3>手臂選型評估 <span class="hint">置中吸取／懸臂</span></h3>
      <ul id="selection" class="checks"></ul>
    </section>
    <section class="card">
      <h3>空間檢核 <span class="hint" id="checkCount"></span></h3>
      <ul id="checks" class="checks"></ul>
    </section>
  </aside>

  <footer id="bottombar">
    <div class="ctl">
      <button id="playBtn" class="primary">⏸ 暫停</button>
      <button id="restartBtn">↺ 重播</button>
      <label>速度 <input id="speed" type="range" aria-label="播放速度"><span id="speedVal">1×</span></label>
      <label class="chk"><input id="loop" type="checkbox" checked> 循環播放</label>
    </div>
    <div class="stepRow"><button id="previous" aria-label="上一步">‹</button><select id="stepSelect" aria-label="動作步驟"></select><button id="next" aria-label="下一步">›</button><span id="cycleTime"></span></div>
    <input id="timeline" aria-label="流程時間" type="range">
    <div id="clock" class="clock">00:00.0</div>
  </footer>

  <div id="loading">載入 3D 場景中…</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
