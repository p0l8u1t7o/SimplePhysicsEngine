<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="../core/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定子轉子自動下料與高度檢測 — 3D 設備模擬</title>
<link rel="stylesheet" href="css/style.css">
<!-- 共用版面（精簡版面、相機視窗、工具列）的樣式 core/ui/viewer-workspace.css 由 createViewerWorkspace 自動載入 -->
<script type="importmap">
{ "imports": {
    "three": "../core/vendor/three.module.js",
    "three/addons/": "../core/vendor/addons/",
    "@core/": "../core/"
} }
</script>
</head>
<body>
<!-- 標準骨架（core/README.md「小螢幕與觸控」）：#topbar（.brand、#stations、.views）、#side、#bottombar（.ctl、.stepRow、#timeline、#clock）；
     窄螢幕與觸控裝置的精簡版面由 createViewerWorkspace 處理，style.css 只寫桌面版面 -->
<div id="app">
  <canvas id="c"></canvas>

  <header id="topbar">
    <div class="brand">
      <div class="title">定子轉子自動下料與高度檢測</div>
      <div class="sub">沖壓機出口 SCARA 自動擺盒，品檢區整盒翻轉／逐顆量測高度（雷射與視覺四方案）</div>
    </div>
    <nav id="stations" aria-label="站別"></nav>
    <div class="views">
      <button data-view="iso">全景</button>
      <button data-view="unloader">下料</button>
      <button data-view="aligner">整列</button>
      <button data-view="pit">地坑</button>
      <button data-view="qc">品檢站</button>
      <button data-view="measure">量測</button>
      <button data-view="top">俯視</button>
    </div>
  </header>

  <aside id="side">
    <section class="card">
      <h3>量測方案</h3>
      <div id="plans" class="seg"></div>
      <div id="parts" class="seg"></div>
      <div id="planDesc" class="desc"></div>
      <div id="specLine" class="spec"></div>
    </section>
    <section class="card">
      <h3>目前動作 <span class="hint" id="stationName"></span></h3>
      <div id="action" class="action">待命</div>
      <div id="substep" class="substep"></div>
    </section>
    <section class="card">
      <h3>量測結果 <span class="hint">灰未量・綠 OK・紅 NG</span></h3>
      <canvas id="grid" width="560" height="220" aria-label="量測結果格位圖"></canvas>
      <div id="resultLine" class="result"></div>
    </section>
    <section class="card">
      <h3>空間檢核 <span class="hint" id="checkCount"></span></h3>
      <ul id="checks" class="checks"></ul>
    </section>
  </aside>

  <footer id="bottombar">
    <div class="ctl">
      <button id="playBtn" class="primary">⏸ 暫停</button>
      <button id="restartBtn">↺ 重播</button>
      <label>速度 <input id="speed" type="range" aria-label="播放速度"><span id="speedVal">1×</span></label>
      <label class="chk"><input id="loop" type="checkbox" checked> 循環播放</label>
    </div>
    <div class="stepRow"><button id="previous" aria-label="上一步">‹</button><select id="stepSelect" aria-label="動作步驟"></select><button id="next" aria-label="下一步">›</button><span id="cycleTime"></span></div>
    <input id="timeline" aria-label="流程時間" type="range">
    <div id="clock" class="clock">00:00.0</div>
  </footer>

  <div id="loading">載入 3D 場景中…</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
