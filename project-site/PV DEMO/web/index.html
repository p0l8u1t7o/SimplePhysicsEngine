<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="../core/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>屋頂光伏電場 — 3D 設備模擬</title>
<link rel="stylesheet" href="css/style.css">
<!-- 共用版面（精簡版面、相機視窗、工具列）的樣式 core/ui/viewer-workspace.css 由 createViewerWorkspace 自動載入 -->
<script type="importmap">
{ "imports": {
    "three": "../core/vendor/three.module.js",
    "three/addons/": "../core/vendor/addons/",
    "@core/": "../core/"
} }
</script>
</head>
<body>
<!-- 標準骨架（core/README.md「小螢幕與觸控」）：#topbar（.brand、#stations、.views）、#side、#bottombar（.ctl、.stepRow、#timeline、#clock） -->
<div id="app">
  <canvas id="c"></canvas>

  <header id="topbar">
    <div class="brand">
      <div class="title">屋頂光伏電場</div>
      <div class="sub">鋸齒屋面與鋼架斜置陣列的屋頂型光伏電場：一天的日照、發電與併網</div>
    </div>
    <nav id="stations" aria-label="站別"></nav>
    <div class="views">
      <button data-view="iso">全景</button>
      <button data-view="saw">鋸齒屋面</button>
      <button data-view="rack">鋼架陣列</button>
      <button data-view="inv">變流器</button>
      <button data-view="top">俯視</button>
    </div>
  </header>

  <aside id="side">
    <section class="card">
      <h3>目前動作 <span class="hint" id="stationName"></span></h3>
      <div id="action" class="action">待命</div>
      <div id="substep" class="substep"></div>
    </section>
    <section class="card">
      <h3>即時發電 <span class="hint">春分・北緯 23°・真太陽時</span></h3>
      <div class="metrics">
        <div><span>時刻</span><b id="mHour">--:--</b></div>
        <div><span>太陽高度</span><b id="mSun">—</b></div>
        <div><span>斜面日射</span><b id="mPoa">—</b></div>
        <div><span>交流輸出</span><b id="mAc">—</b></div>
        <div><span>今日發電</span><b id="mE">—</b></div>
        <div><span>被遮蔭板片</span><b id="mShade">—</b></div>
      </div>
      <canvas id="curve" width="560" height="200" aria-label="發電曲線"></canvas>
      <div class="legend"><i class="l-clear"></i>晴空 <i class="l-ac"></i>實際輸出</div>
    </section>
    <section class="card">
      <h3>變流器 <span class="hint" id="invHint"></span></h3>
      <ul id="invList" class="inv"></ul>
    </section>
    <section class="card">
      <h3>空間檢核 <span class="hint" id="checkCount"></span></h3>
      <ul id="checks" class="checks"></ul>
    </section>
  </aside>

  <footer id="bottombar">
    <div class="ctl">
      <button id="playBtn" class="primary">⏸ 暫停</button>
      <button id="restartBtn">↺ 重播</button>
      <label>速度 <input id="speed" type="range" aria-label="播放速度"><span id="speedVal">1×</span></label>
      <label class="chk"><input id="loop" type="checkbox" checked> 循環播放</label>
    </div>
    <div class="stepRow"><button id="previous" aria-label="上一步">‹</button><select id="stepSelect" aria-label="動作步驟"></select><button id="next" aria-label="下一步">›</button><span id="cycleTime"></span></div>
    <input id="timeline" aria-label="流程時間" type="range">
    <div id="clock" class="clock">00:00.0</div>
  </footer>

  <div id="loading">載入 3D 場景中…</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
