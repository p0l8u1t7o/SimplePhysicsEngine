<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Tiles 範例</title>
<script type="importmap">
{ "imports": {
    "three": "../../vendor/three.module.js",
    "three/addons/": "../../vendor/addons/",
    "@core/": "../../"
} }
</script>
<style>
:root { --bg: #0d1117; --panel: #0b1118e6; --line: #2c3a44; --text: #e6edf3; --mute: #9fb0bd; --ok: #69d48a; --warn: #f0b44c; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.5 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
#c { width: 100%; height: 100%; display: block; }
#panel { position: absolute; left: 12px; top: 10px; width: min(360px, calc(100% - 24px)); padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-sizing: border-box; }
#panel h1 { font-size: 15px; margin: 0 0 4px; }
#panel p { margin: 0 0 8px; color: var(--mute); }
.row { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
.row label { flex: 0 0 auto; color: var(--mute); }
select, input[type=range] { flex: 1; min-width: 0; }
button { padding: 3px 10px; background: #102734; color: var(--text); border: 1px solid #41616d; border-radius: 4px; font: inherit; cursor: pointer; }
dd.sub { grid-column: 1 / -1; text-align: left; color: var(--mute); font-size: 12px; }
dt.h { grid-column: 1 / -1; color: var(--text); font-weight: 600; margin-top: 6px; }
select { padding: 3px; background: #102734; color: var(--text); border: 1px solid #41616d; border-radius: 4px; font: inherit; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; }
dt { color: var(--mute); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--mute); }
.bar { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #2e6fb5, #e0a43a, #c0392b); }
@media (max-width: 600px) { #panel { top: auto; bottom: 10px; max-height: 44%; overflow: auto; } #panel p { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>3D Tiles（core/geo）</h1>
  <p>空拍重建的 3D Tiles（ECEF、橢球高）放進案場座標（TWD97、正高）。資料是合成的：200 m 起伏地形＋一棟建物（<code>make-tileset.mjs</code>）。紅色標竿用經緯度精確換算到建物中心——標竿插在建物正中央代表座標轉換正確。</p>
  <div class="row"><label for="mode">轉換</label><select id="mode"><option value="exact" selected>逐頂點精確（exact）</option><option value="rigid">剛體（ENU 切平面）</option></select></div>
  <dl id="stats"></dl>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
