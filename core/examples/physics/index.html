<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>剛體動力學範例</title>
<script type="importmap">
{ "imports": {
    "three": "../../vendor/three.module.js",
    "three/addons/": "../../vendor/addons/",
    "@core/": "../../"
} }
</script>
<style>
html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font: 13px/1.5 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
#c { width: 100%; height: 100%; display: block; }
#panel { position: absolute; left: 12px; top: 10px; width: min(380px, calc(100% - 24px)); padding: 10px 12px; background: #0b1118e6; border: 1px solid #2c3a44; border-radius: 8px; }
#panel h1 { font-size: 15px; margin: 0 0 6px; }
#panel select { width: 100%; padding: 4px; background: #102734; color: #e6edf3; border: 1px solid #41616d; border-radius: 4px; font: inherit; }
#note { color: #9fb3c0; margin: 6px 0; }
#stats { margin: 6px 0 0; padding: 0; list-style: none; }
#stats li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid #22303a; padding: 3px 0; }
#stats b { color: #ffd079; font-weight: 600; }
#bar { position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #0b1118e6; border: 1px solid #2c3a44; border-radius: 8px; }
#bar button { background: #1f6f8b; color: #fff; border: 0; border-radius: 4px; padding: 4px 12px; font: inherit; cursor: pointer; min-width: 64px; }
#bar input { flex: 1; }
#time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
#meta { color: #7f95a3; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel"><h1>剛體動力學範例（core/physics）</h1><select id="pick" aria-label="情境"></select><p id="note"></p><ul id="stats"></ul><p id="meta"></p></div>
<div id="bar"><button id="play">▶ 播放</button><input id="t" type="range" min="0" max="1" step="0.001" value="0" aria-label="時間"><span id="time">0.00 s</span></div>
<script type="module" src="./demo.js"></script>
</body>
</html>
